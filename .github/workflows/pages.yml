name: Build and publish to GitHub Pages

# Publishes the latest version of the game to https://iddocohen.github.io/math-tank/
# on every push to main or to the feature branch while the first release is built.
on:
  push:
    branches: [main, 001-math-tanks]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The speed tests measure CPU time (T302), so a busy runner does not fail them; the retries stay as a guard
      # for runners that are slower than a developer's computer.
      - run: pnpm test --retry=2
      - run: pnpm exec vite build --base=/math-tank/
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
